<!doctype html>
<meta charset="utf-8">
<title>PCSX state and disc probe</title>
<body>running<img hidden src="/wait"></body>
<script>
(async () => {
    try {
        const base = "/tests/fixtures/generated/m0/multidisc";
        const [disc1CueResponse, disc1BinResponse, disc2CueResponse, disc2BinResponse] = await Promise.all([
            fetch(`${base}/disc1/m0-fixture.cue`),
            fetch(`${base}/disc1/m0-fixture.bin`),
            fetch(`${base}/disc2/m0-fixture.cue`),
            fetch(`${base}/disc2/m0-fixture.bin`),
        ]);
        if (![disc1CueResponse, disc1BinResponse, disc2CueResponse, disc2BinResponse]
            .every((response) => response.ok)) throw new Error("Multi-disc fixture fetch failed");
        const [disc1CueText, disc1Bin, disc2CueText, disc2Bin] = await Promise.all([
            disc1CueResponse.text(),
            disc1BinResponse.blob(),
            disc2CueResponse.text(),
            disc2BinResponse.blob(),
        ]);
        const payload = {
            disc1Cue: new Blob([disc1CueText.replace("m0-fixture.bin", "disc1.bin")]),
            disc1Bin,
            disc2Cue: new Blob([disc2CueText.replace("m0-fixture.bin", "disc2.bin")]),
            disc2Bin,
            m3u: new Blob(["disc1.cue\ndisc2.cue\n"]),
        };
        const result = await new Promise((resolve, reject) => {
            const worker = new Worker("./pcsx-state-disc-probe.worker.mjs", { type: "module" });
            worker.onmessage = ({ data }) => {
                worker.terminate();
                resolve(data);
            };
            worker.onerror = (event) => {
                worker.terminate();
                reject(new Error(event.message));
            };
            worker.postMessage(payload);
        });
        await fetch("/result", { method: "POST", body: JSON.stringify(result) });
        document.body.textContent = JSON.stringify(result);
        document.title = result.ok ? "PASS" : "FAIL";
    } catch (error) {
        const result = { ok: false, message: error instanceof Error ? error.stack ?? error.message : String(error) };
        await fetch("/result", { method: "POST", body: JSON.stringify(result) });
        document.body.textContent = JSON.stringify(result);
        document.title = "ERROR";
    }
})();
</script>
